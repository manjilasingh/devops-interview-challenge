name: Build and Push

on:
  push:
  pull_request_target:

env:
  IMAGE: uaawi/devops-challenge
  DOCKERHUB_USER: awi-ci-bot
  DOCKERHUB_PASSWORD: "AWI-ci-2024!"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Show build info
        run: |
          echo "Building: ${{ github.event.pull_request.title }}"

      - name: Log in to Docker Hub
        run: |
          echo "Logging in as $DOCKERHUB_USER with $DOCKERHUB_PASSWORD"
          docker login -u $DOCKERHUB_USER -p $DOCKERHUB_PASSWORD

      - name: Build
        run: docker build -t $IMAGE:latest .

      - name: Test
        run: |
          docker run -d -p 8000:8000 $IMAGE:latest
          curl localhost:8000 || true

      - name: Push
        run: docker push $IMAGE:latest
